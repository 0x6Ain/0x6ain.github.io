site_name: Backend Handbook
site_url: https://0x6ain.github.io/handbook/
repo_url: https://github.com/0x6Ain/0x6ain.github.io
repo_name: 0x6ain/0x6ain.github.io
edit_uri: edit/main/handbook/docs/

docs_dir: docs

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - 홈: index.md
  - OS:
      - 프로세스, 스레드, Context Switching: os/process-thread.md
      - 프로세스 격리, IPC, 커널/유저 모드: os/process-isolation-ipc.md
      - Memory 구조: os/memory.md
      - GC: os/gc.md
  - Network:
      - TCP vs UDP: network/tcp-udp.md
      - HTTP / HTTPS / TLS: network/http.md
      - Cookie, Session, JWT: network/auth.md
      - REST와 멱등성: network/rest-idempotency.md
      - DNS, Load Balancer: network/dns-lb.md
  - Database:
      - 재고 동시성 문제: database/concurrency.md
      - Deadlock: database/deadlock.md
      - Race Condition: database/race-condition.md
      - Database Backup: database/backup.md
      - Database 보안: database/security.md
  - 자료구조/알고리즘:
      - 자료구조와 시간복잡도: algorithms/data-structures.md
  - 객체지향:
      - SOLID, DI, IoC: oop/solid-di.md
  - 시스템 설계:
      - 시스템 설계 기본기: system-design/basics.md
  - Redis:
      - Redis 자료구조와 TTL: redis/redis-data-structures.md
      - 캐시 전략: redis/redis-caching.md
      - Pub/Sub와 Distributed Lock: redis/redis-pubsub-lock.md
  - Kafka/SQS:
      - Kafka / SQS 기본 개념: kafka/kafka-basics.md
  - AWS:
      - AWS 핵심 서비스: aws/aws-basics.md
  - RAG / 벡터 검색:
      - RAG (검색 증강 생성): rag/rag-overview.md
      - 임베딩: rag/embeddings.md
      - 벡터 검색과 pgvector: rag/vector-search-pgvector.md
      - 의미 검색 vs 키워드 검색: rag/semantic-vs-keyword-search.md
